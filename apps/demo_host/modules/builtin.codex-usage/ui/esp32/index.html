<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=240, initial-scale=1">
  <style>
    *{box-sizing:border-box}html,body{width:240px;height:320px;margin:0;overflow:hidden;background:#f8fafc;color:#151820;font-family:Consolas,"Microsoft YaHei UI",sans-serif}main{height:100%;padding:14px 12px;display:grid;grid-template-rows:auto 1fr auto;border:1px solid #151820}header{display:flex;padding-bottom:10px;border-bottom:1px solid #151820;font-size:13px;font-weight:700}.reading{position:relative;isolation:isolate;align-self:stretch;display:flex;align-items:center;gap:8px;overflow:hidden}.reading strong{position:relative;z-index:2;width:max-content;background:#f8fafc;font-size:82px;font-weight:400;line-height:1}.reading small{position:relative;z-index:2;padding:22px 2px 0 0;background:#f8fafc;font-size:32px;line-height:1;font-weight:700}.watermark{position:absolute;z-index:0;right:0;top:50%;width:120px;height:120px;transform:translateY(-50%);background:url("/screen/assets/chatgpt-icon-dither.png") center/100% 100% no-repeat;image-rendering:pixelated}.facts{display:grid;gap:8px;padding-top:10px;border-top:1px solid #151820;font-size:10px}.facts div{display:flex;justify-content:space-between}
  </style>
  <title>Codex 状态</title>
</head>
<body>
  <main>
    <header><span>CODEX</span></header>
    <section class="reading"><strong id="remaining">--</strong><small>%</small><span class="watermark" aria-hidden="true"></span></section>
    <footer class="facts"><div><span>额度周期</span><b id="quota-window">--</b></div><div><span>计划</span><b id="plan">--</b></div><div><span>重置</span><b id="reset">--</b></div></footer>
  </main>
  <script>
    const id="builtin.codex-usage",$=value=>document.getElementById(value);
    function label(value){const minutes=Number(value?.window_duration_minutes);if(!minutes)return"--";if(minutes%1440===0)return`${minutes/1440}D`;if(minutes%60===0)return`${minutes/60}H`;return`${minutes}M`}
    async function render(){const response=await fetch(`/api/modules/${id}/state`,{cache:"no-store"});const state=(await response.json()).state||{},quota=state.quota||state.primary||state.secondary||{};$('remaining').textContent=quota.remaining_percent??"--";$('quota-window').textContent=label(quota);$('plan').textContent=String(state.plan_type||"--").toUpperCase();$('reset').textContent=quota.resets_at?new Date(quota.resets_at*1000).toLocaleDateString("zh-CN",{month:"2-digit",day:"2-digit"}):"--"}
    render();setInterval(render,10000);
  </script>
</body>
</html>
