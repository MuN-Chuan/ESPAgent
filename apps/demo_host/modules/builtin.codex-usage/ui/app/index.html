<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="app.css">
  <title>Codex 状态</title>
</head>
<body>
  <main class="module-page">
    <header class="module-head">
      <div><span class="section-index">01 / CODEX USAGE</span><h1>Codex 状态</h1></div>
      <div class="head-actions"><span id="status" class="status-label">连接中</span><button id="refresh" type="button">刷新</button></div>
    </header>

    <section class="usage-overview" aria-label="Codex 额度概览">
      <div class="primary-reading">
        <div class="reading-label"><span id="quota-label">额度剩余</span></div>
        <strong><b id="quota-remaining">--</b><small>%</small></strong>
        <em>当前有效额度周期</em>
        <span class="quota-watermark" aria-hidden="true"></span>
      </div>
      <dl class="account-facts">
        <div><dt>计划</dt><dd id="plan">--</dd></div>
        <div><dt>额度组</dt><dd id="limit-name">--</dd></div>
        <div><dt>Credits</dt><dd id="credits">--</dd></div>
        <div><dt>更新时间</dt><dd id="updated-at">--</dd></div>
      </dl>
    </section>

    <section class="window-list">
      <article class="window-row">
        <div class="window-copy"><span id="quota-window">额度周期</span><strong id="quota-value">暂不可用</strong></div>
        <div class="meter" aria-hidden="true"><i id="quota-meter"></i></div>
        <div class="window-reset"><span>重置</span><time id="quota-reset">--</time></div>
      </article>
    </section>

    <section id="notice" class="notice" role="status">
      <strong>正在连接 Codex</strong>
      <span>账户额度将在连接后更新。</span>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
